name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build unsigned app
        run: |
          xcodebuild -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -r Moonlight-custom.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-custom
          path: Moonlight-custom.ipa
